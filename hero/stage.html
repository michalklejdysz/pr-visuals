<!doctype html>
<!--
  README hero, step 2: the whole film as one function of time. render.js calls seek(t) for every
  frame and screenshots it, so nothing depends on how fast Chrome paints. The stills come from
  capture.sh; render.sh puts this file next to them and fills in __STILLS__.
-->
<meta charset="utf-8">
<title>pr-visuals hero</title>
<style>
  html, body { margin: 0; background: #0B0B0F; overflow: hidden }
  #stage { position: relative; width: 1440px; height: 900px; overflow: hidden; background: #0B0B0F; color: #fff; font-family: system-ui, sans-serif }
  #stage div, #stage img, #stage video { position: absolute; box-sizing: border-box }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace }
  .win { background: #111116; border: 1px solid #2A2A33; border-radius: 14px; overflow: hidden; box-shadow: 0 30px 80px rgba(0, 0, 0, .55) }
  .bar { left: 0; right: 0; top: 0; height: 46px; background: #1A1A21; display: flex; align-items: center; gap: 9px; padding: 0 18px }
  #stage .bar span.dot { width: 13px; height: 13px; border-radius: 50%; background: #3F3F46 }
  .caption { left: 64px; bottom: 64px; padding: 14px 28px; border-radius: 999px; background: rgba(11, 11, 15, .9); border: 1px solid #2A2A33; font: 700 40px/1.2 system-ui, sans-serif; white-space: nowrap }
  .card { width: 292px; height: 92px; padding: 16px 18px; background: #1F1F27; border: 1px solid #2A2A33; border-radius: 12px; font: 600 19px/1.35 system-ui, sans-serif; color: #E4E4E7 }
  .line { position: static !important; white-space: pre; height: 1.6em }
  .chip { padding: 8px 14px; border-radius: 9px; background: #6366f1; font: 600 17px ui-monospace, Menlo, monospace; white-space: nowrap }
</style>
<div id="stage"></div>
<script>
  const STILLS = __STILLS__;
  const ACCENT = "#6366f1";
  const TICKET = { id: "DASH-12", title: "Show the revenue trend" };
  const stage = document.getElementById("stage");
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const add = (html, parent = stage) => {
    parent.insertAdjacentHTML("beforeend", html.trim());
    return parent.lastElementChild;
  };

  // ---- timing ----
  const E = {
    lin: (p) => p,
    out: (p) => 1 - (1 - p) ** 3,
    inOut: (p) => (p < 0.5 ? 4 * p ** 3 : 1 - (-2 * p + 2) ** 3 / 2),
    back: (p) => 1 + 2.70158 * (p - 1) ** 3 + 1.70158 * (p - 1) ** 2
  };
  // keys: [[time, value, easing into this key]], held before the first and after the last.
  const at = (keys, t) => {
    if (typeof keys === "number") return keys;
    if (t <= keys[0][0]) return keys[0][1];
    for (let i = 1; i < keys.length; i++) {
      const [t1, v1, ease = E.inOut] = keys[i];
      if (t > t1) continue;
      const [t0, v0] = keys[i - 1];
      return v0 + (v1 - v0) * (t1 > t0 ? ease((t - t0) / (t1 - t0)) : 1);
    }
    return keys[keys.length - 1][1];
  };
  // Visible from a to b, fading `f` seconds at each end.
  const win = (a, b, f = 0.3) => [[a, 0], [a + f, 1], [b - f, 1], [b, 0]];
  const tracks = [];
  const frameFns = [];
  // props: o (opacity), x, y, s (scale), sx, sy, r (deg), each a number or keys.
  const anim = (el, props) => tracks.push({ el, props });
  const each = (fn) => frameFns.push(fn);
  function seek(t) {
    for (const { el, props: p } of tracks) {
      const o = at(p.o ?? 1, t);
      el.style.opacity = o;
      el.style.visibility = o <= 0.001 ? "hidden" : "visible";
      const s = at(p.s ?? 1, t);
      el.style.transform = `translate(${at(p.x ?? 0, t)}px, ${at(p.y ?? 0, t)}px) scale(${at(p.sx ?? s, t)}, ${at(p.sy ?? s, t)}) rotate(${at(p.r ?? 0, t)}deg)`;
    }
    return Promise.all(frameFns.map((fn) => fn(t)));
  }
  const caption = (text, a, b) => anim(add(`<div class="caption">${esc(text)}</div>`), { o: win(a, b), y: [[a, 10], [a + 0.3, 0, E.out]] });

  // ---- title card (also the poster frame GitHub shows before play) ----
  const titleCard = (withCommand) => add(`
    <div style="inset:0;display:grid;place-items:center;background:#0B0B0F">
      <div style="position:static;text-align:center">
        <div style="position:static;font:800 104px system-ui,sans-serif;letter-spacing:-.02em">pr-visuals</div>
        <div style="position:static;margin-top:16px;font:500 34px system-ui,sans-serif;color:#A1A1AA">Your coding agent puts before/after proof in every PR</div>
        ${withCommand ? `<div class="mono" style="position:static;display:inline-block;margin-top:48px;padding:16px 28px;border-radius:12px;background:#16161C;border:1px solid #2A2A33;font-size:27px;color:#E4E4E7">npx skills add michalklejdysz/pr-visuals</div>` : ""}
      </div>
    </div>`);
  anim(titleCard(false), { o: [[1.7, 1], [2.2, 0]], y: [[1.7, 0], [2.2, -24]] });

  // ---- board: the ticket is dragged to In progress, the agent's avatar pops ----
  const COL = 320, GAP = 28, TOP = 190, X0 = (1440 - (3 * COL + 2 * GAP)) / 2;
  const cardX = (c) => X0 + c * (COL + GAP) + 14, cardY = (i) => TOP + 66 + i * 106;
  const board = add(`<div style="inset:0"></div>`);
  add(`<div style="left:${X0}px;top:${TOP - 80}px;font:700 30px system-ui,sans-serif">Team board <span style="font-weight:500;color:#71717A">· current sprint</span></div>`, board);
  ["To do", "In progress", "Done"].forEach((name, c) =>
    add(`<div style="left:${X0 + c * (COL + GAP)}px;top:${TOP}px;width:${COL}px;height:${900 - TOP - 170}px;background:#16161C;border-radius:16px;padding:20px;font:700 15px system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#71717A">${name}</div>`, board));
  [["Update onboarding copy", 0, 0], ["Fix CSV export dates", 0, 2], ["Add keyboard shortcuts", 1, 0], ["Dark mode for settings", 2, 0], ["Rate-limit login attempts", 2, 1]].forEach(([title, c, i]) =>
    add(`<div class="card" style="left:${cardX(c)}px;top:${cardY(i)}px">${title}</div>`, board));
  anim(board, { o: [[2.0, 0], [2.4, 1], [5.9, 1], [6.3, 0]], y: [[2.0, 20], [2.4, 0, E.out]], s: [[5.9, 1], [6.3, 0.97]] });

  const DX = COL + GAP;
  const ticket = add(`<div class="card" style="left:${cardX(0)}px;top:${cardY(1)}px;border:2px solid ${ACCENT};color:#fff;box-shadow:0 14px 34px rgba(0,0,0,.5)">${TICKET.id} · ${TICKET.title}
      <div style="right:12px;bottom:10px;width:34px;height:34px;border-radius:50%;background:${ACCENT};display:grid;place-items:center;font:700 13px system-ui,sans-serif"></div></div>`);
  const avatar = ticket.lastElementChild;
  avatar.textContent = "AI";
  anim(ticket, {
    o: [[2.0, 0], [2.4, 1], [6.0, 1], [6.15, 0]],
    x: [[3.1, 0], [4.0, DX]],
    y: [[2.0, 20], [2.4, 0, E.out], [3.1, 0], [3.25, -8], [4.0, -8], [4.12, 0]],
    r: [[3.1, 0], [3.25, -2], [4.0, -2], [4.12, 0]]
  });
  anim(avatar, { s: [[4.15, 0], [4.5, 1, E.back]] });
  const ARROW = "polygon(0 0, 0 84%, 26% 64%, 44% 100%, 60% 93%, 42% 58%, 78% 58%)";
  const cursor = add(`<div style="left:0;top:0;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))">
      <div style="left:-2px;top:-3px;width:26px;height:36px;background:#0B0B0F;clip-path:${ARROW}"></div>
      <div style="left:0;top:0;width:22px;height:31px;background:#fff;clip-path:${ARROW}"></div></div>`);
  const grabX = cardX(0) + 146, grabY = cardY(1) + 46;
  anim(cursor, {
    o: [[2.4, 0], [2.6, 1], [4.3, 1], [4.6, 0]],
    x: [[2.4, 1100], [3.05, grabX], [3.1, grabX], [4.0, grabX + DX], [4.6, grabX + DX + 70]],
    y: [[2.4, 820], [3.05, grabY], [3.1, grabY], [3.25, grabY - 8], [4.0, grabY - 8], [4.6, grabY + 90]]
  });
  caption("A ticket comes in", 2.3, 3.9);
  caption("Your agent picks it up", 4.0, 5.9);

  // ---- terminal: grows out of the ticket card, then the agent codes ----
  const T = { x: 170, y: 130, w: 1100, h: 640 };
  const term = add(`<div class="win" style="left:${T.x}px;top:${T.y}px;width:${T.w}px;height:${T.h}px;transform-origin:0 0">
      <div class="bar"><span class="dot" style="position:static;background:#F87171"></span><span class="dot" style="position:static;background:#FBBF24"></span><span class="dot" style="position:static;background:#4ADE80"></span>
        <span style="position:static;margin-left:12px;font:600 18px system-ui,sans-serif;color:#A1A1AA">agent · <span style="color:#fff">${TICKET.id}</span></span></div>
      <div class="mono" style="left:0;right:0;top:46px;padding:26px 30px;font-size:28px;font-weight:500"></div></div>`);
  const [termBar, termBody] = term.children;
  const C = { x: cardX(1), y: cardY(1), w: 292, h: 92 };
  const SPLIT = { x: 40, y: 200, s: 0.6 };
  anim(term, {
    o: [[6.0, 0], [6.15, 1], [17.8, 1], [18.3, 0]],
    x: [[6.1, C.x - T.x], [6.75, 0], [10.6, 0], [11.4, SPLIT.x - T.x]],
    y: [[6.1, C.y - T.y], [6.75, 0], [10.6, 0], [11.4, SPLIT.y - T.y]],
    sx: [[6.1, C.w / T.w], [6.75, 1], [10.6, 1], [11.4, SPLIT.s], [17.8, SPLIT.s], [18.3, SPLIT.s * 0.97]],
    sy: [[6.1, C.h / T.h], [6.75, 1], [10.6, 1], [11.4, SPLIT.s], [17.8, SPLIT.s], [18.3, SPLIT.s * 0.97]]
  });
  anim(termBar.children[3], { o: [[6.7, 0], [6.9, 1]] });
  const LINES = [
    [6.9, `$ agent "implement ${TICKET.id}"`],
    [7.95, `  reading ${TICKET.id} · 2 criteria`],
    [8.5, "  ✎ dashboard/index.tsx  +4 −1"],
    [9.05, "  ▲ green trend · dark mode checked"],
    [9.6, "  ✓ typecheck and tests pass"],
    [11.7, "$ pr-screenshots"],
    [12.5, "  after-light.png ✓"],
    [13.2, "  swap 1 file to main · hot reload"],
    [15.2, "  before-light.png ✓ · restored"],
    [17.2, "  ✓ attached to PR #1"]
  ];
  const TYPE = 0.03; // s per typed character
  const lineEls = LINES.map(([, text]) =>
    add(`<div class="line" style="color:${text.startsWith("$") ? "#F4F4F5" : text.includes("✓") ? "#4ADE80" : "#A1A1AA"}"></div>`, termBody));
  each((t) => {
    let last = -1, typing = false;
    LINES.forEach(([start, text], i) => {
      const el = lineEls[i];
      if (t < start) return (el.textContent = "");
      last = i;
      if (text.startsWith("$")) {
        const n = Math.min(text.length, Math.floor((t - start) / TYPE) + 1);
        typing = n < text.length;
        el.textContent = text.slice(0, n);
        el.style.opacity = 1;
      } else {
        el.textContent = text;
        el.style.opacity = Math.min(1, (t - start) / 0.15);
      }
    });
    // A block cursor after the newest line: solid while typing, blinking otherwise.
    if (last >= 0 && (typing || Math.floor(t * 1.8) % 2 === 0)) lineEls[last].insertAdjacentHTML("beforeend", `<span style="position:static;display:inline-block;width:.6em;height:1.1em;margin-left:.15em;vertical-align:-.2em;background:#A1A1AA"></span>`);
  });
  caption("It writes the code", 7.0, 10.4);

  // ---- split: the agent's browser, the real after/before stills, zoom on the card ----
  const B = { x: 730, y: 200, w: 670 };
  B.s = B.w / 1440; B.h = 900 * B.s;
  const browser = add(`<div class="win" style="left:${B.x}px;top:${B.y}px;width:${B.w}px;height:${B.h + 40}px;border-radius:12px">
      <div class="bar" style="height:40px"><span class="dot" style="position:static"></span><span class="dot" style="position:static"></span><span class="dot" style="position:static"></span>
        <span class="mono" style="position:static;margin-left:12px;font-size:16px;color:#A1A1AA">localhost:5173 · agent's browser</span></div>
      <div style="left:0;top:40px;width:${B.w}px;height:${B.h}px;overflow:hidden;background:#fff">
        <div style="left:0;top:0;width:1440px;height:900px;transform-origin:0 0">
          <img src="app-after.png" style="left:0;top:0;width:1440px;height:900px">
          <img src="app-before.png" style="left:0;top:0;width:1440px;height:900px">
        </div>
        <div style="inset:0;background:#fff"></div>
      </div></div>`);
  anim(browser, { o: [[10.8, 0], [11.6, 1], [17.8, 1], [18.3, 0]], x: [[10.8, 90], [11.6, 0, E.out]], s: [[17.8, 1], [18.3, 0.97]] });
  const view = browser.children[1];
  const [cam, flash] = view.children;
  const beforeImg = cam.children[1];
  const card = STILLS.after.card;
  const Z = 3.6;
  const zoom = [[13.2, 0], [14.0, 1], [16.3, 1], [17.1, 0]];
  each((t) => {
    // The camera moves the card's centre to the middle of the view while it zooms in.
    const p = at(zoom, t), k = B.s * (1 + (Z - 1) * p);
    const cx = card.x + card.width / 2, cy = card.y + card.height / 2;
    const tx = p * (B.w / 2 - cx * B.s * Z), ty = p * (B.h / 2 - cy * B.s * Z);
    cam.style.transform = `translate(${tx}px, ${ty}px) scale(${k})`;
  });
  // The hot reload: the old card in, then back to the new one.
  anim(beforeImg, { o: [[14.25, 0], [14.55, 1], [15.9, 1], [16.2, 0]] });
  anim(flash, { o: [[12.4, 0], [12.42, 0.75], [12.75, 0, E.out], [15.1, 0], [15.12, 0.75], [15.45, 0, E.out]] });
  const chip = (label, a, b) => anim(add(`<div class="chip" style="left:16px;bottom:16px">📸 ${label}</div>`, view), { o: win(a, b, 0.2), y: [[a, 8], [a + 0.2, 0, E.out]] });
  chip("after-light.png", 12.4, 13.4);
  chip("before-light.png", 15.1, 16.1);
  caption("Then it shoots the new screen", 11.8, 13.95);
  caption("…and the same screen before the change", 14.05, 17.5);

  // ---- before / after: both crops fly out of the browser's card ----
  const PAD = 14, CW = 600;
  const crop = { x: card.x - PAD, y: card.y - PAD, w: card.width + PAD * 2, h: card.height + PAD * 2 };
  const k = CW / crop.w, CH = crop.h * k;
  const from = { x: B.x + crop.x * B.s, y: B.y + 40 + crop.y * B.s, s: (crop.w * B.s) / CW };
  [["Before", "app-before.png", 80, 0], ["After", "app-after.png", 1440 - 80 - CW, 0.08]].forEach(([label, src, x, lag]) => {
    const y = (900 - CH) / 2 + 24;
    const box = add(`<div style="left:${x}px;top:${y}px;width:${CW}px;height:${CH}px;border-radius:16px;overflow:hidden;transform-origin:0 0;box-shadow:0 24px 60px rgba(0,0,0,.6)${label === "After" ? `,0 0 0 3px ${ACCENT}` : ""}">
        <img src="${src}" style="left:${-crop.x * k}px;top:${-crop.y * k}px;width:${1440 * k}px;height:${900 * k}px"></div>`);
    anim(box, { o: [[17.9, 0], [18.0, 1], [21.2, 1], [21.6, 0]], x: [[18.0 + lag, from.x - x], [18.9 + lag, 0]], y: [[18.0 + lag, from.y - y], [18.9 + lag, 0]], s: [[18.0 + lag, from.s], [18.9 + lag, 1]] });
    const tag = add(`<div style="left:${x}px;top:${y - 58}px;font:700 34px system-ui,sans-serif;color:${label === "After" ? "#fff" : "#A1A1AA"}">${label}</div>`);
    anim(tag, { o: [[18.8 + lag, 0], [19.1 + lag, 1], [21.2, 1], [21.6, 0]], y: [[18.8 + lag, 8], [19.1 + lag, 0, E.out]] });
  });

  // ---- the real PR on github.com: scroll to the table, then to the player ----
  const G = 21.4, GH = STILLS.github, BAR = 52;
  const gh = add(`<div style="inset:0;background:#fff">
      <div style="left:0;top:0;width:1440px;height:${BAR}px;background:#1A1A21;display:flex;align-items:center;gap:9px;padding:0 20px">
        <span class="dot" style="position:static;width:13px;height:13px;border-radius:50%;background:#3F3F46"></span><span style="position:static;width:13px;height:13px;border-radius:50%;background:#3F3F46"></span><span style="position:static;width:13px;height:13px;border-radius:50%;background:#3F3F46"></span>
        <span class="mono" style="position:static;margin-left:18px;padding:6px 16px;border-radius:8px;background:#0B0B0F;font-size:17px;color:#D4D4D8">github.com/michalklejdysz/shadcn-admin/pull/1</span></div>
      <div style="left:0;top:${BAR}px;width:1440px;height:${900 - BAR}px;overflow:hidden">
        <div style="left:0;top:0;width:1440px">
          <img src="github.png" style="position:static;display:block;width:1440px">
          <div style="left:${GH.player.x}px;top:${GH.player.y}px;width:${GH.player.width}px;height:${GH.player.height}px;border-radius:6px;box-shadow:0 0 0 4000px rgba(11,11,15,.6)"></div>
          <div style="left:${GH.player.x}px;top:${GH.player.y - 72}px;padding:10px 22px;border-radius:999px;background:${ACCENT};font:700 32px system-ui,sans-serif">The video your reviewer gets ↓</div>
          <div style="left:${GH.player.x + 22}px;top:${GH.player.y + GH.player.height - 52}px;width:64px;height:64px;border-radius:50%;border:3px solid ${ACCENT}"></div>
        </div></div></div>`);
  const page = gh.children[1].firstElementChild;
  const [, spot, label, pulse] = page.children;
  const view2 = 900 - BAR;
  const scrollTable = GH.shots.y - 110;
  const scrollPlayer = Math.min(GH.height - view2, GH.player.y + GH.player.height / 2 - view2 / 2);
  anim(page, { y: [[G + 2.0, 0], [G + 3.6, -scrollTable], [G + 5.6, -scrollTable], [G + 7.0, -scrollPlayer]] });
  caption("Your reviewer opens the PR", G + 0.4, G + 2.9);
  caption("The same shots, in the PR", G + 3.3, G + 5.7);
  const PLAY = G + 8.4;
  anim(pulse, { o: [[PLAY - 0.4, 0], [PLAY - 0.38, 0.9], [PLAY, 0]], s: [[PLAY - 0.4, 0], [PLAY, 1, E.out]] });

  // ---- the PR's video: grows out of the player, plays in full, unchanged, shrinks back ----
  const video = add(`<video src="stage-video.webm" muted preload="auto" style="left:0;top:0;width:1240px;transform-origin:0 0;background:#000"></video>`);
  const FRAME = { x: 100, w: 1240, h: 775 };
  FRAME.y = (900 - FRAME.h + 44) / 2;
  const P0 = { x: GH.player.x, y: BAR + GH.player.y - scrollPlayer, s: GH.player.width / FRAME.w };
  const dark = add(`<div style="inset:0;background:#0B0B0F"></div>`);
  const tagBar = add(`<div class="mono" style="left:${FRAME.x}px;top:${FRAME.y - 44}px;width:${FRAME.w}px;height:44px;padding:11px 18px;background:#16161C;border:1px solid #2A2A33;border-bottom:0;border-radius:10px 10px 0 0;font-size:19px;color:#E4E4E7">PR VIDEO · made by pr-demo-video</div>`);
  stage.appendChild(video); // above the dark backdrop

  let END = 0;
  const ready = (async () => {
    await Promise.all([...document.images].map((i) => i.decode()));
    if (video.readyState < 2) await new Promise((r) => (video.onloadeddata = r));
    const VD = video.duration;
    const GROW = 0.9, HOLD = PLAY + VD + 0.6, SHRUNK = HOLD + 0.8;
    anim(spot, { o: [[G + 7.0, 0], [G + 7.4, 1], [PLAY, 1], [PLAY + 0.5, 0]] });
    anim(label, { o: [[G + 7.1, 0], [G + 7.4, 1], [PLAY, 1], [PLAY + 0.3, 0]], y: [[G + 7.1, 8], [G + 7.4, 0, E.out]] });
    anim(video, {
      o: [[PLAY - 0.01, 0], [PLAY, 1]],
      x: [[PLAY, P0.x], [PLAY + GROW, FRAME.x], [HOLD, FRAME.x], [SHRUNK, P0.x]],
      y: [[PLAY, P0.y], [PLAY + GROW, FRAME.y], [HOLD, FRAME.y], [SHRUNK, P0.y]],
      s: [[PLAY, P0.s], [PLAY + GROW, 1], [HOLD, 1], [SHRUNK, P0.s]]
    });
    anim(dark, { o: [[PLAY, 0], [PLAY + GROW, 0.92], [HOLD, 0.92], [SHRUNK, 0]] });
    anim(tagBar, { o: [[PLAY + GROW - 0.2, 0], [PLAY + GROW + 0.1, 1], [HOLD - 0.2, 1], [HOLD, 0]] });
    END = SHRUNK + 0.9;
    anim(gh, { o: [[G, 0], [G + 0.6, 1]] });
    anim(titleCard(true), { o: [[END, 0], [END + 0.6, 1]], y: [[END, 16], [END + 0.6, 0, E.out]] });
    each((t) => {
      const want = Math.max(0, Math.min(VD - 0.001, t - PLAY));
      if (Math.abs(video.currentTime - want) < 0.0005) return;
      return new Promise((r) => { video.onseeked = r; video.currentTime = want; });
    });
    window.DURATION = END + 4.6;
    await seek(0);
  })();
  window.ready = ready;
  window.seek = seek;
</script>
